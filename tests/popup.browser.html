<!doctype html><meta charset="utf-8"><title>Popup check</title>
<pre id="result">RUNNING</pre><iframe id="popup" style="width:320px;height:420px"></iframe>
<script type="module">
// Loads the real toolbar popup with simulated extension storage and messages,
// and checks its numbers and buttons. Serve the repository root and open this
// file (see extension/README.md).
const result = document.querySelector("#result");
const assert = (ok, message) => { if (!ok) throw new Error(message); };
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const TWO_HOURS_AGO = new Date(Date.now() - 2 * 3600 * 1000).toISOString();

window.testStorage = {
  profile: { name: "Maria", titles: ["Waiter"], locations: ["Greece"] },
  apps: [{ id: "a1", status: "sent" }, { id: "a2", status: "prepared" }],
  jobs: Array.from({ length: 1500 }, (_, n) => ({ id: `j${n}` })),
  state: { lastScan: TWO_HOURS_AGO },
};
window.browserErrors = [];
window.messages = [];
window.openedTabs = [];
// The worker sends the best 200 matches and counts all of them.
window.MATCHES_ANSWER = { ok: true, matches: Array.from({ length: 200 }, (_, n) => ({ id: `m${n}` })),
  counts: { all: 1234, remote: 300, today: 50, salary: 80 } };

try {
  const base = new URL("../extension/", location.href).href;
  const html = await (await fetch(base + "popup.html", { cache: "reload" })).text();
  const shim = `<base href="${base}"><script>
    window.addEventListener('error', e => parent.browserErrors.push(e.message));
    window.addEventListener('unhandledrejection', e => parent.browserErrors.push(String(e.reason)));
    const pick = (keys) => {
      const store = parent.testStorage;
      if (keys == null) return structuredClone(store);
      const names = typeof keys === 'string' ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys);
      return Object.fromEntries(names.filter((k) => k in store).map((k) => [k, structuredClone(store[k])]));
    };
    window.close = () => parent.messages.push({ type: 'window.close' });
    window.chrome = {
      storage: { local: { get: async (keys) => pick(keys), set: async (patch) => Object.assign(parent.testStorage, patch) } },
      i18n: { getUILanguage: () => 'en' },
      tabs: { create: (options) => parent.openedTabs.push(options.url) },
      runtime: {
        getURL: (path) => '${base}' + path,
        sendMessage: async (message) => {
          parent.messages.push(message);
          if (message.type === 'matches') return structuredClone(parent.MATCHES_ANSWER);
          if (message.type === 'scan') return { ok: true, added: 3 };
          return { ok: true };
        },
      },
    };
  <` + `/script>`;
  const frame = document.querySelector("#popup");
  frame.srcdoc = html.replace("<head>", "<head>" + shim);
  const doc = () => frame.contentDocument;
  for (let n = 0; n < 100 && doc()?.querySelector("#last")?.textContent === "—"; n++) await wait(30);
  await wait(200);

  assert(doc().querySelector("#m").textContent === (1234).toLocaleString(),
    `matches shows ${doc().querySelector("#m").textContent}: the count of the 200 sent, not of all 1234`);
  assert(doc().querySelector("#a").textContent === "2", "applications");
  assert(doc().querySelector("#j").textContent === "1500", "jobs tracked");
  assert(doc().querySelector("#last").textContent === "last search 2h ago", `last search: ${doc().querySelector("#last").textContent}`);

  doc().querySelector("#scan").click();
  for (let n = 0; n < 50 && doc().querySelector("#scan").disabled; n++) await wait(20);
  assert(messages.some((m) => m.type === "scan"), "Scan now sent no scan");
  assert(doc().querySelector("#scan").textContent === "Found 3 new", `after the scan: ${doc().querySelector("#scan").textContent}`);

  doc().querySelector("#open").click();
  await wait(100);
  assert(openedTabs.length === 1 && openedTabs[0].endsWith("app.html"), `opened: ${openedTabs.join(", ")}`);
  assert(!browserErrors.length, `browser errors: ${browserErrors.join("; ")}`);

  result.textContent = "PASS: the popup counts all matches, not only the ones sent along; shows applications, "
    + "jobs and the last search; Scan now scans and reports what it found; Open dashboard opens it; no browser errors.";
} catch (error) {
  result.textContent = "FAIL: " + error.message + "\n" + browserErrors.join("; ");
}
</script>

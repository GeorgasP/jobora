<!doctype html><meta charset="utf-8"><title>Settings regression check</title>
<pre id="result">RUNNING</pre><iframe id="app" style="width:1200px;height:900px"></iframe>
<script type="module">
// Loads the real app page with simulated extension storage and checks what a
// new CV upload in Settings does. Serve the repository root and open this file
// (see extension/README.md).
const result = document.querySelector("#result");
window.testStorage = {
  profile: { name: "", email: "", location: "", titles: ["Barista"], locations: ["Remote"] },
};
window.browserErrors = [];
window.grantedOrigins = new Set();
window.permissionRequests = [];
const assert = (ok, message) => { if (!ok) throw new Error(message); };
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
try {
  const base = new URL("../extension/", location.href).href;
  const html = await (await fetch(base + "app.html")).text();
  const shim = `<base href="${base}"><script>
    window.addEventListener('error', e => parent.browserErrors.push(e.message));
    window.addEventListener('unhandledrejection', e => parent.browserErrors.push(String(e.reason)));
    const pick = (keys) => {
      const store = parent.testStorage;
      if (keys == null) return structuredClone(store);
      const names = typeof keys === 'string' ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys);
      return Object.fromEntries(names.filter((k) => k in store).map((k) => [k, structuredClone(store[k])]));
    };
    window.chrome = {
      storage: { local: {
        get: async (keys) => pick(keys),
        set: async (patch) => { Object.assign(parent.testStorage, structuredClone(patch)); },
        remove: async (key) => { delete parent.testStorage[key]; },
      } },
      i18n: { getUILanguage: () => 'en' },
      runtime: {
        getURL: (path) => '${base}' + path,
        sendMessage: async (msg) => (msg && msg.type === 'matches' ? { matches: [] } : { ok: true }),
        reload: () => {},
      },
      scripting: {
        getRegisteredContentScripts: async () => [],
        registerContentScripts: async () => {}, unregisterContentScripts: async () => {},
      },
      permissions: {
        request: async ({ origins }) => {
          parent.permissionRequests.push(origins);
          origins.forEach((o) => parent.grantedOrigins.add(o));
          return true;
        },
        remove: async ({ origins }) => { origins.forEach((o) => parent.grantedOrigins.delete(o)); return true; },
        contains: async ({ origins }) => origins.every((o) => parent.grantedOrigins.has(o)),
      },
    };
  <` + `/script>`;
  const frame = document.querySelector("#app");
  frame.srcdoc = html.replace("<head>", "<head>" + shim);
  for (let n = 0; n < 150 && !frame.contentDocument?.querySelector("#cv-file")?.onchange; n++) await wait(30);
  const doc = frame.contentDocument;
  assert(doc.querySelector("#cv-file").onchange, "app module did not initialize");
  await wait(300);

  const cv = "Maria Papadopoulou\nSpata, Attica, Greece | maria@example.test\nExperience\n" +
    "Customer Service Representative — Telecroft, 2024–2025\nHandled billing questions";
  const file = new frame.contentWindow.File([cv], "new-cv.txt");
  await doc.querySelector("#cv-file").onchange({ target: { files: [file] } });

  assert(testStorage.profile.location === "Spata, Attica, Greece", "the CV address did not fill the empty location");
  const offered = [...doc.querySelectorAll("#titles-sug button")].map((b) => b.dataset.t);
  assert(offered.includes("Customer Service Representative"),
    `the new CV's job title is not offered, got ${JSON.stringify(offered)}`);
  assert(!offered.includes("Barista"), "a title the user already has is offered again");
  assert(testStorage.profile.titles.join() === "Barista", "titles changed before the user chose any");

  doc.querySelector('#titles-sug button[data-t="Customer Service Representative"]').click();
  await wait(1200);  // settings save 800 ms after the last change
  assert(JSON.stringify(testStorage.profile.titles) === JSON.stringify(["Barista", "Customer Service Representative"]),
    `clicking the suggestion did not save the title, got ${JSON.stringify(testStorage.profile.titles)}`);
  assert(!doc.querySelector("#titles-sug button"), "the chosen suggestion is still offered");

  // The job portals ask for their sites in the app, never in the manifest.
  const offer = doc.querySelector("#portals-offer");
  const toggle = doc.querySelector("#tog-portals");
  assert(!offer.hidden, "the job portals are not offered to a user who hasn't allowed them");
  doc.querySelector("#portals-on").click();
  await wait(300);
  assert(permissionRequests.length === 1 && permissionRequests[0].includes("https://europa.eu/*"),
    "Chrome was not asked for the portal sites");
  assert(offer.hidden, "the offer stays after the portals were turned on");
  assert(toggle.classList.contains("on"), "the Settings switch does not show the portals as on");
  toggle.click();
  await wait(300);
  assert(grantedOrigins.size === 0, "turning the switch off did not give the sites back");
  assert(!toggle.classList.contains("on"), "the switch stays on after turning it off");
  assert(!offer.hidden, "the offer does not come back after the portals were turned off");
  doc.querySelector("#portals-later").click();
  await wait(200);
  assert(offer.hidden && testStorage.portalsOfferDismissed === true, "Not now did not put the offer away");

  assert(browserErrors.length === 0, browserErrors.join("; "));
  result.textContent = "PASS: a new CV fills the empty location, offers its job titles without changing them, and one click adds and saves a title; the job portals are offered, asked for, switched off and dismissed; no browser errors.";
} catch (error) { result.textContent = "FAIL: " + error.stack + "\n" + browserErrors.join("; "); }
</script>
